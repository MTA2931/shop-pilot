
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">

  <defs>
    <!-- Primary brand gradient -->
    <linearGradient
      id="shopGradient"
      x1="8"
      y1="6"
      x2="56"
      y2="58"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <!-- Subtle highlight -->
    <linearGradient
      id="highlight"
      x1="16"
      y1="10"
      x2="48"
      y2="54"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="17"
    fill="url(#shopGradient)"
  />

  <!-- Background highlight -->
  <path
    d="M20 4H44C53.4 4 60 10.6 60 20V32C46 29 35 18 20 4Z"
    fill="url(#highlight)"
  />

  <!-- Store roof -->
  <path
    d="M15 25L20 15H44L49 25"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Store awning -->
  <path
    d="M13 25H51"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- Store body -->
  <path
    d="M16 25V45C16 47.2 17.8 49 20 49H44C46.2 49 48 47.2 48 45V25"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Entrance -->
  <path
    d="M26 49V35C26 33.9 26.9 33 28 33H36C37.1 33 38 33.9 38 35V49"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Navigation / Pilot indicator -->
  <circle
    cx="46"
    cy="18"
    r="8"
    fill="#ffffff"
  />

  <path
    d="M43.5 18H48.5M46 15.5L48.5 18L46 20.5"
    stroke="#047857"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Base accent -->
  <path
    d="M23 54H41"
    stroke="#ffffff"
    stroke-opacity=".35"
    stroke-width="2"
    stroke-linecap="round"
  />

</svg>
