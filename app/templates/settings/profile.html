{% extends "base.html" %}

{% block title %}پروفایل - {{ shop_name }}{% endblock %}

{% block page_title %}پروفایل کاربری{% endblock %}
{% block page_subtitle %}مدیریت اطلاعات شخصی{% endblock %}

{% block page_actions %}
<div class="page-actions">
    <a href="{{ url_for('settings.change_password_settings') }}" class="btn btn-secondary">
        <i class="fa-solid fa-key"></i> تغییر رمز عبور
    </a>
</div>
{% endblock %}

{% block content %}
<div class="card form-card form-card-md">
    <form method="POST" action="{{ url_for('settings.profile') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-grid">
            <!-- Editable fields -->
            <div class="form-group">
                <label class="form-label" for="full_name">نام کامل</label>
                <input type="text" id="full_name" name="full_name" class="form-control"
                       autocomplete="name"
                       value="{{ current_user.full_name or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">ایمیل</label>
                <input type="email" id="email" name="email" class="form-control input-ltr"
                       autocomplete="email"
                       value="{{ current_user.email or '' }}">
            </div>

            <!-- Read-only info -->
            <div class="form-group">
                <label class="form-label" for="username">نام کاربری</label>
                <input type="text" id="username" class="form-control input-ltr"
                       value="{{ current_user.username }}" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label class="form-label" for="role">نقش</label>
                <input type="text" id="role" class="form-control"
                       value="{{ current_user.role_label }}" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label class="form-label" for="status">وضعیت</label>
                <input type="text" id="status" class="form-control"
                       value="{% if current_user.is_active %}فعال{% else %}غیرفعال{% endif %}" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label class="form-label" for="last_login">آخرین ورود</label>
                <input type="text" id="last_login" class="form-control input-ltr"
                       value="{{ current_user.last_login_at|strftime('%Y/%m/%d %H:%M') if current_user.last_login_at else '-' }}"
                       readonly tabindex="-1">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> به‌روزرسانی پروفایل
            </button>
        </div>
    </form>
</div>
{% endblock %}
