{% extends "base.html" %}

{% block title }}پروفایل - {{ shop_name }}{% endblock %}

{% block page_title %}پروفایل کاربری{% endblock %}
{% block page_subtitle %>مدیریت اطلاعات شخصی{% endblock %}

{% block page_actions %}
<a href="{{ url_for('settings.change_password_settings') }}" class="btn">تغییر رمز عبور</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('settings.profile') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group" style="text-align: right;">
            <label class="form-label">نام کاربری</label>
            <input type="text" class="form-control" value="{{ current_user.username }}" readonly style="background:var(--bg);">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">نام کامل</label>
            <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">ایمیل</label>
            <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">نقش</label>
            <input type="text" class="form-control" value="{{ current_user.role_label }}" readonly style="background:var(--bg);">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">وضعیت</label>
            <input type="text" class="form-control" value="{% if current_user.is_active %}فعال{% else %}غیرفعال{% endif %}" readonly style="background:var(--bg);">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">آخرین ورود</label>
            <input type="text" class="form-control" value="{{ current_user.last_login_at[:16] if current_user.last_login_at else '-' }}" readonly style="background:var(--bg);">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">
            <i class="fa-solid fa-save"></i> به‌روزرسانی پروفایل
        </button>
    </form>
</div>
{% endblock %}
