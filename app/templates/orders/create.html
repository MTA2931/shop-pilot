{% extends "base.html" %}

{% block title %}ثبت سفارش جدید - {{ shop_name }}{% endblock %}

{% block page_title %}ثبت سفارش جدید{% endblock %}
{% block page_subtitle %}ایجاد سفارش جدید برای مشتری{% endblock %}

{% block page_actions %}
<div class="page-actions">
    <a href="{{ url_for('orders.index') }}" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-right"></i> بازگشت به لیست
    </a>
</div>
{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST" action="{{ url_for('orders.create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="order_number">
                    شماره سفارش <span class="form-label-note">(خودکار)</span>
                </label>
                <input type="text" id="order_number" class="form-control input-ltr"
                       value="#{{ '1001' }}" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label class="form-label" for="customer_name">نام مشتری</label>
                <input type="text" id="customer_name" name="customer_name" class="form-control" required
                       placeholder="نام و نام خانوادگی مشتری"
                       value="{{ order_data.customer_name if order_data else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="customer_phone">تلفن مشتری</label>
                <input type="tel" id="customer_phone" name="customer_phone" class="form-control input-ltr"
                       placeholder="شماره تماس" inputmode="tel"
                       value="{{ order_data.customer_phone if order_data else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="total_amount">مبلغ کل (تومان)</label>
                <input type="number" id="total_amount" name="total_amount" class="form-control" required min="0"
                       inputmode="numeric"
                       value="{{ order_data.total_amount if order_data else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="channel">کانال فروش</label>
                <select id="channel" name="channel" class="form-control">
                    <option value="instagram" {% if order_data and order_data.channel == 'instagram' %}selected{% endif %}>اینستاگرام</option>
                    <option value="phone" {% if order_data and order_data.channel == 'phone' %}selected{% endif %}>تماس تلفنی</option>
                    <option value="other" {% if order_data and order_data.channel == 'other' %}selected{% endif %}>سایر</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="status">وضعیت اولیه</label>
                <select id="status" name="status" class="form-control">
                    <option value="pending" {% if order_data and order_data.status == 'pending' %}selected{% endif %}>در انتظار پرداخت</option>
                    <option value="processing" {% if order_data and order_data.status == 'processing' %}selected{% endif %}>در حال پردازش</option>
                    <option value="completed" {% if order_data and order_data.status == 'completed' %}selected{% endif %}>تکمیل‌شده</option>
                    <option value="cancelled" {% if order_data and order_data.status == 'cancelled' %}selected{% endif %}>لغو‌شده</option>
                </select>
            </div>

            <div class="form-group span-2">
                <label class="form-label" for="customer_address">آدرس</label>
                <textarea id="customer_address" name="customer_address" class="form-control"
                          placeholder="آدرس تحویل">{{ order_data.customer_address if order_data else '' }}</textarea>
            </div>

            <div class="form-group span-2">
                <label class="form-label" for="description">توضیحات / محصولات</label>
                <textarea id="description" name="description" class="form-control" required
                          placeholder="لیست محصولات و توضیحات سفارش">{{ order_data.description if order_data else '' }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> ثبت سفارش
            </button>
        </div>
    </form>
</div>
{% endblock %}
