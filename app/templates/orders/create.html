{% extends "base.html" %}

{% block title %}ثبت سفارش جدید - {{ shop_name }}{% endblock %}

{% block page_title %}ثبت سفارش جدید{% endblock %}
{% block page_subtitle %}ایجاد سفارش جدید برای مشتری{% endblock %}

{% block page_actions %}
<a href="{{ url_for('orders.index') }}" class="btn" style="background:var(--line); color:var(--text);">بازگشت به لیست</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('orders.create') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group" style="text-align: right;">
            <label class="form-label">شماره سفارش <span style="color:var(--muted); font-weight:400;">(خودکار)</span></label>
            <input type="text" class="form-control" value="#{{ '1001' }}" readonly style="background:var(--bg);">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">نام مشتری</label>
            <input type="text" name="customer_name" class="form-control" required
                   placeholder="نام و نام خانوادگی مشتری"
                   value="{{ order_data.customer_name if order_data else '' }}">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">تلفن مشتری</label>
            <input type="tel" name="customer_phone" class="form-control"
                   placeholder="شماره تماس"
                   value="{{ order_data.customer_phone if order_data else '' }}">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">آدرس</label>
            <textarea name="customer_address" class="form-control"
                      placeholder="آدرس تحویل">{{ order_data.customer_address if order_data else '' }}</textarea>
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">توضیحات / محصولات</label>
            <textarea name="description" class="form-control" required
                      placeholder="لیست محصولات و توضیحات سفارش">{{ order_data.description if order_data else '' }}</textarea>
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">مبلغ کل (تومان)</label>
            <input type="number" name="total_amount" class="form-control" required min="0"
                   value="{{ order_data.total_amount if order_data else '' }}">
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">کانال فروش</label>
            <select name="channel" class="form-control">
                <option value="website" {% if order_data and order_data.channel == 'website' %}selected{% endif %}>وبسایت</option>
                <option value="instagram" {% if order_data and order_data.channel == 'instagram' %}selected{% endif %}>اینستاگرام</option>
                <option value="phone" {% if order_data and order_data.channel == 'phone' %}selected{% endif %>>تماس تلفنی</option>
                <option value="other" {% if order_data and order_data.channel == 'other' %}selected{% endif %>>سایر</option>
            </select>
        </div>

        <div class="form-group" style="text-align: right;">
            <label class="form-label">وضعیت اولیه</label>
            <select name="status" class="form-control">
                <option value="pending" {% if order_data and order_data.status == 'pending' %}selected{% endif %}>در انتظار پرداخت</option>
                <option value="processing" {% if order_data and order_data.status == 'processing' %}selected{% endif %}>در حال پردازش</option>
                <option value="completed" {% if order_data and order_data.status == 'completed' %}selected{% endif %}>تکمیل‌شده</option>
                <option value="cancelled" {% if order_data and order_data.status == 'cancelled' %}selected{% endif %}>لغو‌شده</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">
            <i class="fa-solid fa-save"></i> ثبت سفارش
        </button>
    </form>
</div>
{% endblock %}
